<!doctype html><html><head><style>
body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;background:linear-gradient(135deg,#4F6DF5,#2B3FB8);position:relative;color:#fff}
.left{position:absolute;left:64px;top:118px;width:520px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(10,20,80,.35)}
h1{font-size:46px;margin:0;font-weight:700;letter-spacing:-.5px}
p{font-size:23px;line-height:1.4;margin:26px 0 0;color:#DDE3FF}
.chips{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 14px;font-size:16px}
.phone{position:absolute;right:70px;top:40px;width:250px;height:556px;border-radius:34px;background:#0E1020;padding:10px;box-shadow:0 24px 60px rgba(5,10,50,.5);transform:rotate(4deg)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:26px;display:block}
</style></head><body>
<div class="left">
  <div class="brand"><img src="icon.svg"><h1>Docs Manager Pro</h1></div>
  <p>Edit PDFs on the page, convert to and from Word, Excel and PowerPoint, and read every document.</p>
  <div class="chips"><span>No ads</span><span>No account</span><span>Works offline</span><span>Open source</span></div>
</div>
<div class="phone"><img src="../raw3/editor.png"></div>
</body></html>
